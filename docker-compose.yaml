version: "3.0"

services:
  db:
    container_name: "avitostata_db"
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    networks:
      - custom
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: "redis"
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - custom
    volumes:
      - redis_data:/data

  django:
    build:
      context: .
    depends_on:
      - db
      - redis
    command: "python3 manage.py runserver"
    restart: always
    ports:
      - "8000:8000"
    networks:
      - custom
    env_file: ".env"
    volumes:
      - .:/avitostat

networks:
  custom:
    driver: bridge

volumes:
  pgdata:
  redis_data:
