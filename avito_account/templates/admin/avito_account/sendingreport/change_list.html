{% extends "admin/change_list.html" %}

{% block result_list %}
    {{ block.super }}
    <tfoot>
        <tr class="total" style="background-color: #f9f9f9; font-weight: bold;">
            <td colspan="4" style="text-align: right; padding-right: 20px;">
                <strong>Итого:</strong>
            </td>
            <td style="text-align: center; color: #007bff;">
                Completion (на вычисления):
                <span style="color: #d9534f; padding-left: 10px;">{{ total_tokens_completion }}</span>
                <span style="padding-left: 40px;"></span>
            </td>
            <td style="text-align: center; color: #007bff;">
                Prompt (контекст):
                <span style="color: #d9534f; padding-left: 10px;">{{ total_tokens_prompt }}</span>
                <span style="padding-left: 40px;"></span>
            </td>
            <td style="text-align: center; color: #007bff;">
                Стоимость:
                <span style="color: #28a745; padding-left: 10px;">{{ total_tokens_price }} руб.</span>
                <span style="padding-left: 40px;"></span>
            </td>
            <td></td>  <!-- Пустая ячейка для последней колонки (timestamp) -->
        </tr>
    </tfoot>
{% endblock %}
