{% extends "admin/base_site.html" %}

{% block branding %}
<div style="text-align: center; margin-bottom: 20px;">
    <h1 id="site-name" style="font-size: 24px; font-weight: bold; margin: 0;">
        <a href="{% url 'admin:index' %}" style="text-decoration: none; color: yellowgreen;">AVITOSTATA</a>
    </h1>
    <h2 style="font-size: 16px; margin: 10px 0; color: yellowgreen;">Личный кабинет</h2>
    
    <div style="display: inline-block; margin: 5px;">
        <span style="font-size: 16px; color: yellowgreen; font-weight: bold;"> avito аккаунтов: {{ active_accounts }}</span>
    </div>  
    
    <div style="display: inline-block; margin: 5px;">
        <span style="font-size: 16px; color: yellowgreen; font-weight: bold;">💰 Баланс: {{ balance }}</span>
    </div>
    
    <div style="display: inline-block; margin: 5px;">
        <span style="font-size: 16px; color: yellowgreen;">📅 Осталось дней: {{ days_left }}</span>
    </div>
</div>

<!-- Плашка для пополнения баланса -->
<div style="text-align: center; margin: 20px;">
    <a href="#" id="top-up-balance" style="padding: 5px 10px; background-color: #e2e6ea; border-radius: 5px; color: #0056b3; font-weight: bold; text-decoration: none; font-size: 12px;">
        💳 Пополнить
    </a>
</div>

<!-- Ссылки для пополнения на разные периоды -->
<div id="top-up-options" style="text-align: center; display: none; margin-top: 10px;">
    <a href="{% url 'create_payment' 1 %}" target="_blank" style="display: block; margin: 5px; padding: 5px 10px; background-color: #e2e6ea; border-radius: 5px; color: #0056b3; font-weight: bold; text-decoration: none; font-size: 12px;">
        📆 1 месяц
        <br>
        <span style="color: red;">без скидки </span>
    </a>
    <a href="{% url 'create_payment' 3 %}" target="_blank" style="display: block; margin: 5px; padding: 5px 10px; background-color: #e2e6ea; border-radius: 5px; color: #0056b3; font-weight: bold; text-decoration: none; font-size: 12px;">
        📅 3 месяца
        <br>
        <span style="color: red;">скидка 2.5% 🎉</span>
    </a>
    <a href="{% url 'create_payment' 6 %}" target="_blank" style="display: block; margin: 5px; padding: 5px 10px; background-color: #e2e6ea; border-radius: 5px; color: #0056b3; font-weight: bold; text-decoration: none; font-size: 12px;">
        🗓️ 6 месяцев
        <br>
        <span style="color: red;">скидка 5% 🔥</span>
    </a>
</div>

<script>
    // Скрипт для отображения ссылок пополнения
    document.getElementById('top-up-balance').addEventListener('click', function(event) {
        event.preventDefault();
        var optionsDiv = document.getElementById("top-up-options");
        if (optionsDiv.style.display === "none") {
            optionsDiv.style.display = "block";
        } else {
            optionsDiv.style.display = "none";
        }
    });
</script>

{% endblock %}
